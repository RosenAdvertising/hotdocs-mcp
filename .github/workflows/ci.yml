name: CI
# Reusable CI workflow for this public repository.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    uses: RosenAdvertising/oss-workflows/.github/workflows/ci.yml@d1bff32cee8cba8f4053c17902d9eaef9eb41a91 # v2
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
